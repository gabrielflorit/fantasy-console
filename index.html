<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #222;
        color: #ddd;
        font-family: ui-monospace, monospace;
      }
      /* CODE view: editor left, preview + state pane right. Desktop only —
         router and a mobile "edit on desktop" message come in later phases. */
      #code {
        display: flex;
        height: 100%;
      }
      #editor {
        flex: 1;
        min-width: 0;
        background: #1a1a1a;
        color: #eee;
        border: none;
        outline: none;
        resize: none;
        padding: 12px;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        line-height: 1.5;
        tab-size: 2;
      }
      #side {
        width: 320px;
        display: flex;
        flex-direction: column;
        border-left: 1px solid #000;
      }
      #canvas {
        image-rendering: pixelated;
        /* 64 × 5 — integer scale keeps pixels crisp. */
        width: 320px;
        height: 320px;
        display: block;
        background: #000;
        touch-action: none;
      }
      #state {
        flex: 1;
        margin: 0;
        padding: 12px;
        overflow: auto;
        font-size: 12px;
        color: #9fca9f;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main id="code">
      <textarea id="editor" spellcheck="false"></textarea>
      <div id="side">
        <canvas id="canvas" width="64" height="64"></canvas>
        <pre id="state"></pre>
      </div>
    </main>
    <script type="module" src="./shell/index.js"></script>
    <script>
      new EventSource('/__reload').onmessage = () => location.reload()
    </script>
  </body>
</html>
