<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <style>
      html,
      body {
        background: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        margin: 0;
        overflow: hidden;
        /* No scroll bleed or pinch-zoom when tapping to play. */
        touch-action: none;
      }
      canvas {
        image-rendering: pixelated;
        /* Largest square that fits the viewport, preserving 1:1 aspect. */
        width: min(100vw, 100vh);
        height: min(100vw, 100vh);
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="64" height="64"></canvas>
    <script type="module" src="./shell/index.js"></script>
    <script>
      new EventSource('/__reload').onmessage = () => location.reload()
    </script>
  </body>
</html>
