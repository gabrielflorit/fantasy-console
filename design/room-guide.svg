<svg xmlns="http://www.w3.org/2000/svg" width="1512" height="857" viewBox="0 0 1512 857" font-family="ui-monospace, monospace">
  <!-- ============================================================
       Desk-room placement guide (v2). All-in-one console, Uniscope/VT05
       styling: three stacked rows —
         row 1  wide 16:9 monitor (the live screen)
         row 2  IMSAI switches (left half) | tape deck (right half)
         row 3  keyboard (full width)
       Shelf off to the right. Monochrome line art; NOT final art — a
       reference layer to place live DOM components over. Grid 100px.
       ============================================================ -->

  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 H0 V100" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1512" height="857" fill="#101010"/>
  <rect width="1512" height="857" fill="url(#grid)"/>
  <line x1="0" y1="300" x2="1512" y2="300" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="6 8"/>

  <!-- ================= ALL-IN-ONE CONSOLE ================= -->
  <!-- molded outer shell -->
  <rect x="300" y="90" width="700" height="660" rx="26" fill="none" stroke="#5f5f5f" stroke-width="2"/>

  <!-- row 1: MONITOR (wide 16:9 glass) -->
  <g stroke="#cfcfcf" stroke-width="2" fill="none" stroke-linejoin="round">
    <rect x="380" y="118" width="540" height="312" rx="22"/>            <!-- bezel -->
    <rect x="410" y="140" width="480" height="270" rx="18" fill="#0a0a0a" stroke="#8a8a8a"/> <!-- glass -->
  </g>
  <text x="424" y="162" fill="#8a8a8a" font-size="13" letter-spacing="1">MONITOR / screen — 16:9</text>
  <text x="424" y="400" fill="#4f4f4f" font-size="10">x410 y140  480×270</text>

  <!-- row dividers + middle vertical split -->
  <g stroke="#4a4a4a" stroke-width="2">
    <line x1="300" y1="452" x2="1000" y2="452"/>
    <line x1="300" y1="642" x2="1000" y2="642"/>
    <line x1="650" y1="452" x2="650" y2="642"/>
  </g>

  <!-- row 2 left: IMSAI SWITCH CONTROLLER -->
  <text x="316" y="474" fill="#8a8a8a" font-size="11" letter-spacing="1">IMSAI SWITCHES</text>
  <!-- decorative toggles -->
  <g stroke="#7a7a7a" stroke-width="2" fill="#1a1a1a">
    <rect x="322" y="492" width="14" height="30" rx="3"/>
    <rect x="352" y="492" width="14" height="30" rx="3"/>
    <rect x="382" y="492" width="14" height="30" rx="3"/>
  </g>
  <!-- the four FUNCTIONAL switches (overlay targets in index.html) -->
  <g stroke="#cfcfcf" stroke-width="2" fill="#242424">
    <rect x="356" y="540" width="46" height="58" rx="5"/>
    <rect x="410" y="540" width="46" height="58" rx="5"/>
    <rect x="464" y="540" width="46" height="58" rx="5"/>
    <rect x="528" y="540" width="46" height="58" rx="5"/>
  </g>
  <g fill="#9a9a9a" font-size="11" text-anchor="middle" letter-spacing="0.5">
    <text x="379" y="618">RUN</text>
    <text x="433" y="618">CODE</text>
    <text x="487" y="618">HELP</text>
    <text x="551" y="618">PAUSE</text>
  </g>
  <!-- pause status light (driven live; the one color anchor) -->
  <circle cx="551" cy="524" r="5" fill="#f0f0f0"/>

  <!-- row 2 right: TAPE DECK -->
  <text x="666" y="474" fill="#8a8a8a" font-size="11" letter-spacing="1">TAPE DECK</text>
  <g stroke="#cfcfcf" stroke-width="2" fill="none" stroke-linejoin="round">
    <rect x="720" y="502" width="210" height="104" rx="6" stroke="#8a8a8a" fill="#141414"/>
    <circle cx="768" cy="554" r="22" stroke="#8a8a8a"/>
    <circle cx="882" cy="554" r="22" stroke="#8a8a8a"/>
  </g>

  <!-- row 3: KEYBOARD -->
  <text x="316" y="666" fill="#8a8a8a" font-size="11" letter-spacing="1">KEYBOARD</text>
  <g stroke="#6f6f6f" stroke-width="2" fill="#181818">
    <!-- three key rows -->
    <g>
      <rect x="330" y="676" width="40" height="18" rx="3"/><rect x="378" y="676" width="40" height="18" rx="3"/>
      <rect x="426" y="676" width="40" height="18" rx="3"/><rect x="474" y="676" width="40" height="18" rx="3"/>
      <rect x="522" y="676" width="40" height="18" rx="3"/><rect x="570" y="676" width="40" height="18" rx="3"/>
      <rect x="618" y="676" width="40" height="18" rx="3"/><rect x="666" y="676" width="40" height="18" rx="3"/>
      <rect x="714" y="676" width="40" height="18" rx="3"/><rect x="762" y="676" width="40" height="18" rx="3"/>
      <rect x="810" y="676" width="40" height="18" rx="3"/><rect x="858" y="676" width="40" height="18" rx="3"/>
      <rect x="906" y="676" width="40" height="18" rx="3"/><rect x="954" y="676" width="16" height="18" rx="3"/>
    </g>
    <g>
      <rect x="342" y="700" width="40" height="18" rx="3"/><rect x="390" y="700" width="40" height="18" rx="3"/>
      <rect x="438" y="700" width="40" height="18" rx="3"/><rect x="486" y="700" width="40" height="18" rx="3"/>
      <rect x="534" y="700" width="40" height="18" rx="3"/><rect x="582" y="700" width="40" height="18" rx="3"/>
      <rect x="630" y="700" width="40" height="18" rx="3"/><rect x="678" y="700" width="40" height="18" rx="3"/>
      <rect x="726" y="700" width="40" height="18" rx="3"/><rect x="774" y="700" width="40" height="18" rx="3"/>
      <rect x="822" y="700" width="40" height="18" rx="3"/><rect x="870" y="700" width="40" height="18" rx="3"/>
      <rect x="918" y="700" width="52" height="18" rx="3"/>
    </g>
    <!-- spacebar -->
    <rect x="470" y="724" width="360" height="18" rx="3"/>
  </g>

  <!-- ================= SHELF (right) ================= -->
  <g stroke="#cfcfcf" stroke-width="2" fill="none" stroke-linejoin="round">
    <rect x="1180" y="170" width="320" height="460" rx="4"/>
    <line x1="1180" y1="280" x2="1500" y2="280" stroke="#8a8a8a"/>
    <line x1="1180" y1="390" x2="1500" y2="390" stroke="#8a8a8a"/>
    <line x1="1180" y1="500" x2="1500" y2="500" stroke="#8a8a8a"/>
  </g>
  <g stroke="#7a7a7a" stroke-width="2" fill="#1a1a1a">
    <rect x="1198" y="196" width="16" height="74" rx="2"/><rect x="1220" y="196" width="16" height="74" rx="2"/>
    <rect x="1242" y="196" width="16" height="74" rx="2"/>
    <rect x="1198" y="306" width="16" height="74" rx="2"/><rect x="1220" y="306" width="16" height="74" rx="2"/>
    <rect x="1198" y="416" width="16" height="74" rx="2"/><rect x="1220" y="416" width="16" height="74" rx="2"/>
    <rect x="1242" y="416" width="16" height="74" rx="2"/>
  </g>
  <text x="1190" y="622" fill="#8a8a8a" font-size="13" letter-spacing="1">SHELF</text>

  <!-- ================= RULERS ================= -->
  <g fill="#5a6a5a" font-size="10">
    <text x="204" y="16">200</text><text x="404" y="16">400</text><text x="604" y="16">600</text>
    <text x="804" y="16">800</text><text x="1004" y="16">1000</text><text x="1204" y="16">1200</text><text x="1404" y="16">1400</text>
    <text x="4" y="204">200</text><text x="4" y="404">400</text><text x="4" y="604">600</text><text x="4" y="804">800</text>
  </g>
</svg>
